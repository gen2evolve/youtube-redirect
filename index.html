<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Gen2Evolve</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; background-color: #f9f9f9; 
        }
        .btn {
            padding: 15px 30px; background-color: #ff0000; color: white;
            text-decoration: none; border-radius: 25px; font-weight: bold;
            font-size: 1.2rem; transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        p { color: #555; margin-bottom: 20px; }
    </style>
</head>
<body>

    <p>Redirecting to YouTube...</p>
    <a href="https://www.youtube.com/@Gen2Evolve" id="yt-link" class="btn">Open YouTube App</a>

    <script>
        (function() {
            const webUrl = "https://www.youtube.com/@Gen2Evolve";
            const androidIntent = "intent://www.youtube.com/@Gen2Evolve#Intent;package=com.google.android.youtube;scheme=https;end";
            const iosScheme = "youtube://www.youtube.com/@Gen2Evolve";

            const ua = navigator.userAgent || navigator.vendor || window.opera;

            // 1. Try Automatic Redirect
            if (/android/i.test(ua)) {
                window.location.replace(androidIntent);
            } else if (/iPad|iPhone|iPod/.test(ua)) {
                // On iOS, we try the scheme, but often the user MUST click the button
                window.location.replace(iosScheme);
                // Fallback to web link if they don't have the app
                setTimeout(() => { window.location.replace(webUrl); }, 2500);
            } else {
                window.location.replace(webUrl);
            }
        })();
    </script>
</body>
</html>
